<!doctype html><html><head><meta charset="utf-8"><style>body{width:290px;font:14px system-ui;padding:16px;color:#153a3a}button{display:block;width:100%;margin:10px 0;padding:10px;border:0;border-radius:7px;background:#007f80;color:white}p{line-height:1.5}label{display:block;margin-top:14px;font-weight:600}input{width:100%;box-sizing:border-box;margin:6px 0 0;padding:8px;border:1px solid #cfd8d8;border-radius:7px;font:inherit}</style></head><body><h2>Kennect Browser</h2><p>Chrome connects automatically. Ask Codex to open a website in a new tab. Codex can also select existing website tabs. Use the button below to connect this tab or resume after pausing.</p><button id="connect">Connect current website / Resume</button><button id="disconnect">Pause connection</button><p id="status">Checking connection…</p><label for="label">Profile label</label><input id="label" maxlength="40" placeholder="e.g. Butterbase" autocomplete="off"><small id="autoHint" style="display:block;color:#4a6b6b;margin:2px 0 0">Leave empty to use the signed-in account email.</small><button id="saveLabel">Save label</button></body></html>
